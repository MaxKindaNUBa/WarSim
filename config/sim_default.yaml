# World/simulation config: environment physics, the heuristic baseline agent, and the
# pygame renderer. See training_default.yaml for reward/train/eval.
#
# --env-config / --agent-config / --render-config CLI flags still take a standalone file
# matching just that section's schema (flat, not nested under env:/agent:/render:).

env:
  map:
    width: 100.0                 # map units (x)
    height: 100.0                # map units (y)

  bin_size_degrees: 36           # orientation bin width; N_BINS = 360/this = 10. Must divide 360 evenly.

  timestep_duration_s: 0.5       # sim seconds per tick; only paces GUI playback, headless runs uncapped

  episode:
    max_timesteps: 200          # episode times out if neither side is dead by this tick
    min_spawn_separation: 20.0   # min soldier-enemy spawn distance (rejection-sampled)

  movement:
    step_size: 2.0                # distance moved per tick (diagonal moves normalized to this length too)

  gun:
    max_ammo: 20                  # per-episode ammo; firing at 0 ammo is a no-op "empty gun fire"
    max_range: 50.0                # shots beyond this never resolve
    fire_cooldown_steps: 3         # ticks between shots

    accuracy_table:                # hit probability by range, np.interp lookup (clamps past last point)
      distances: [0,    10,   20,   30,   40,   50]
      values:    [0.95, 0.85, 0.75, 0.55, 0.35, 0.15]

    damage_table:                  # damage on hit by range, same lookup mechanics
      distances: [0,  10, 20, 30, 40, 50]
      values:    [40, 35, 28, 20, 12, 5]

  soldier:
    max_hp: 100

  enemy:
    max_hp: 100

# Heuristic baseline agent (evaluate.py / watch_policy.py). RandomAgent has no tunable params.
agent:
  heuristic:
    preferred_range: 15.0    # standoff range: holds position within this, else closes in.
                              # Always faces true bearing and fires whenever ready, at any range.

# Pygame GUI (render_mode="human" only, e.g. watch_policy.py). Colors are [R,G,B], 0-255.
render:
  window:
    margin_px: 40              # border around the map, px
    scale_px_per_unit: 8       # px per map unit
    fps: 60                    # render loop framerate (independent of timestep_duration_s)

  colors:
    background: [20, 20, 25]
    border: [200, 200, 200]
    range_circle: [90, 90, 100]      # faded circle at gun.max_range
    soldier: [70, 160, 255]
    enemy: [255, 90, 90]
    hp_bar_background: [60, 60, 60]
    hp_bar_foreground: [60, 220, 100]
    tracer: [255, 240, 120]          # hit tracer line

  hp_bar:
    width_px: 40
    height_px: 6

  orientation_indicator:
    length_px: 18
