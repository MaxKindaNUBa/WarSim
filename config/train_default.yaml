# DQN training hyperparameters — all tunable, none hardcoded in code.

seed: 42
device: cuda                          # fail loudly at startup if torch.cuda.is_available() is False

enemy_fire_enabled: false             # Phase 4: start with enemy firing disabled

network:
  hidden_layers: [256, 256, 256]

replay_buffer:
  capacity: 100000
  batch_size: 128
  min_size_before_training: 1000

optim:
  learning_rate: 0.0001
  gamma: 0.99

target_network:
  sync_interval_steps: 1000           # hard update

epsilon:
  start: 1.0
  end: 0.05
  decay_steps: 200000

train_every_n_steps: 1

num_episodes: 20000

checkpoint:
  interval_episodes: 1000
  eval_interval_episodes: 500
  eval_episodes: 50
