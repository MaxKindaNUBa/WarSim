# Environment configuration — map, timing, spawn, gun/ammo, lookup tables.
# All values here are placeholders: fixed for now, tunable later, never hardcoded in code.

map:
  width: 100.0
  height: 100.0

bin_size_degrees: 10          # N_BINS = 360 / bin_size_degrees = 36

timestep_duration_s: 0.5      # real-world seconds represented by one simulation tick

episode:
  max_timesteps: 500
  min_spawn_separation: 20.0  # minimum distance between soldier and enemy at reset

movement:
  step_size: 2.0               # distance covered per move action, per tick

gun:
  max_ammo: 20
  max_range: 50.0
  fire_cooldown_steps: 3

  # accuracy(distance): probability of hit at given range, np.interp breakpoints
  accuracy_table:
    distances: [0,    10,   20,   30,   40,   50]
    values:    [0.95, 0.85, 0.65, 0.45, 0.25, 0.05]

  # damage(distance): damage dealt on a hit at given range, np.interp breakpoints
  damage_table:
    distances: [0,  10, 20, 30, 40, 50]
    values:    [40, 35, 28, 20, 12, 5]

soldier:
  max_hp: 100

enemy:
  max_hp: 100
