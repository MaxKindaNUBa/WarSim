# Reward shaping configuration — all weights/penalties, none hardcoded in code.

hit_reward_scale: 1.0                 # multiplied by damage dealt on a landed hit
damage_taken_penalty_scale: 1.0       # multiplied by damage received

step_penalty: -0.01                   # flat penalty applied every timestep

terminal:
  win: 50.0                           # enemy killed
  lose: -50.0                         # soldier killed
  timeout: -10.0                      # max_timesteps reached with both alive

empty_gun_fire_penalty: -1.0          # attempting to fire with 0 ammo

orientation_shaping_bonus_weight: 0.05  # small bonus for orienting toward true enemy bearing
